name: Cleanup merged temporary branches

on:
  pull_request:
    types: [closed]
    branches: [develop, master]

permissions:
  contents: read

jobs:
  cleanup:
    name: Safely delete merged temporary branches
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.pull_request.base.ref == 'develop' && (startsWith(github.event.pull_request.head.ref, 'feature/') || startsWith(github.event.pull_request.head.ref, 'fix/'))) ||
        (github.event.pull_request.base.ref == 'master' && startsWith(github.event.pull_request.head.ref, 'release/'))
      )
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete only original merged SHA
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_ref="refs/heads/${HEAD_BRANCH}"
          current_sha="$(git ls-remote --heads origin "${remote_ref}" | awk '{print $1}')"
          if [ -z "$current_sha" ]; then
            echo 'Branch already absent'
            exit 0
          fi
          if [ "$current_sha" != "$MERGED_HEAD_SHA" ]; then
            echo 'Branch advanced; preserving it'
            exit 0
          fi
          if git push --force-with-lease="${remote_ref}:${MERGED_HEAD_SHA}" origin ":${remote_ref}"; then
            echo "Deleted safely: ${HEAD_BRANCH}"
            exit 0
          fi
          echo '::error::Safe deletion failed; manual verification required'
          exit 1

  audited_historical_cleanup:
    name: One-time verified cleanup of two already-merged PR branches
    # Job is intentionally bound to this exact reviewed cleanup PR only.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/maintenance-cleanup-verified-20261121'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify original merged PR and lease before deleting each historical ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Exactly two historical branches, both merged via squash; do not expand.
          while IFS='|' read -r pr branch sha; do
            [ -n "$pr" ] || continue
            gh api "repos/${GH_REPO}/pulls/${pr}" \
              --jq ".merged == true and .head.ref == \"${branch}\" and .head.sha == \"${sha}\"" \
              | grep -qx true || { echo "::error::PR ${pr} has no verified merged head"; exit 1; }
            ref="refs/heads/${branch}"
            actual="$(git ls-remote --heads origin "${ref}" | awk '{print $1}')"
            if [ -z "$actual" ]; then
              echo "Already absent: ${branch}"
              continue
            fi
            if [ "$actual" != "$sha" ]; then
              echo "::error::Ref advanced; preserving ${branch}"
              exit 1
            fi
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              push --force-with-lease="${ref}:${sha}" origin ":${ref}"
            echo "Verified deletion: ${branch} (${sha})"
          done <<'MERGED_BRANCHES'
          52|fix/match-modal-scroll-footer|6d0da136bbdbf910b2659c56da02413637e4f1c4
          59|docs/issue-38-current-stack-safe|0380ed7dbc797bc0992a7a396fe5a9408803c56e
          MERGED_BRANCHES
