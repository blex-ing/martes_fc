name: Cleanup merged temporary branches

on:
  pull_request:
    types: [closed]
    branches: [develop, master]

permissions:
  contents: read

jobs:
  cleanup:
    name: Safely delete merged temporary branches
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.pull_request.base.ref == 'develop' && (startsWith(github.event.pull_request.head.ref, 'feature/') || startsWith(github.event.pull_request.head.ref, 'fix/'))) ||
        (github.event.pull_request.base.ref == 'master' && startsWith(github.event.pull_request.head.ref, 'release/'))
      )
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete only original merged SHA
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_ref="refs/heads/${HEAD_BRANCH}"
          current_sha="$(git ls-remote --heads origin "${remote_ref}" | awk '{print $1}')"
          if [ -z "$current_sha" ]; then
            echo 'Branch already absent'
            exit 0
          fi
          if [ "$current_sha" != "$MERGED_HEAD_SHA" ]; then
            echo 'Branch advanced; preserving it'
            exit 0
          fi
          if git push --force-with-lease="${remote_ref}:${MERGED_HEAD_SHA}" origin ":${remote_ref}"; then
            echo "Deleted safely: ${HEAD_BRANCH}"
            exit 0
          fi
          echo '::error::Safe deletion failed; manual verification required'
          exit 1

  legacy_sync_v011:
    name: Retire only audited sync/v0.1.1 by SHA lease
    # One-shot task for issue #38. Removed on the release branch after execution.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/issue-38-safe-history-audit'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify ancestry and delete just the reviewed ref
        env:
          LEGACY_REF: refs/heads/sync/v0.1.1
          EXPECTED_SHA: 507756ba7b2e2d6665cc281ff1ad23ab64a346ed
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --heads origin "${LEGACY_REF}" | awk '{print $1}')"
          if [ -z "$remote_sha" ]; then
            echo "Historical branch already absent; no operation needed"
            exit 0
          fi
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo '::error::Historical branch advanced; refusing to delete any ref'
            exit 1
          fi
          git fetch --quiet origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/master; then
            echo '::error::Historical commit is not an ancestor of master; preserve branch'
            exit 1
          fi
          git push --force-with-lease="${LEGACY_REF}:${EXPECTED_SHA}" origin ":${LEGACY_REF}"
          echo 'Deleted only audited sync/v0.1.1, with SHA lease and ancestry check'
