name: Cleanup merged temporary branches

on:
  pull_request:
    types: [closed]
    branches: [develop, master]

permissions:
  contents: read

jobs:
  cleanup:
    name: Safely delete merged temporary branches
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.pull_request.base.ref == 'develop' && (startsWith(github.event.pull_request.head.ref, 'feature/') || startsWith(github.event.pull_request.head.ref, 'fix/'))) ||
        (github.event.pull_request.base.ref == 'master' && startsWith(github.event.pull_request.head.ref, 'release/'))
      )
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete only original merged SHA
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_ref="refs/heads/${HEAD_BRANCH}"
          current_sha="$(git ls-remote --heads origin "${remote_ref}" | awk '{print $1}')"
          if [ -z "$current_sha" ]; then
            echo 'Branch already absent'
            exit 0
          fi
          if [ "$current_sha" != "$MERGED_HEAD_SHA" ]; then
            echo 'Branch advanced; preserving it'
            exit 0
          fi
          if git push --force-with-lease="${remote_ref}:${MERGED_HEAD_SHA}" origin ":${remote_ref}"; then
            echo "Deleted safely: ${HEAD_BRANCH}"
            exit 0
          fi
          echo '::error::Safe deletion failed; manual verification required'
          exit 1

  one_time_pr49_cleanup:
    name: SHA leased cleanup of superseded PR49
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/maintenance-pr49-cleanup-20261121'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify original PR and replacement PRs, then delete by SHA lease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/issue-37-cross-browser-responsive-qa'
          sha='b177975060367bcd41f0b46dcfb6bc01b04a8a47'
          test "$(gh api "repos/${GH_REPO}/pulls/49" --jq '.state')" = closed
          test "$(gh api "repos/${GH_REPO}/pulls/49" --jq '.merged')" = false
          test "$(gh api "repos/${GH_REPO}/pulls/49" --jq '.head.ref')" = "$branch"
          test "$(gh api "repos/${GH_REPO}/pulls/49" --jq '.head.sha')" = "$sha"
          for pr in 58 74; do
            test "$(gh api "repos/${GH_REPO}/pulls/${pr}" --jq '.merged')" = true
          done
          ref="refs/heads/${branch}"
          actual="$(git ls-remote --heads origin "${ref}" | awk '{print $1}')"
          if [ -z "$actual" ]; then echo 'Already absent'; exit 0; fi
          if [ "$actual" != "$sha" ]; then echo '::error::Branch moved'; exit 1; fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --force-with-lease="${ref}:${sha}" origin ":${ref}"
          echo "Deleted verified obsolete branch: ${branch} (${sha})"
