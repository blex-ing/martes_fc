name: CI MARTES FC

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master, 'feature/**', 'release/**']

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript, lint, domain tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run check:public
      - run: npm run check:design
      - run: npm run check:d1
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - run: npm run lint
      - run: npm test
      - run: npm run test:worker
      - run: python3 scripts/check-concurrent-update.py
      - name: Validate SQL migrations and referential integrity
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          db.executescript(Path('../migrations/0001_initial.sql').read_text())
          assert db.execute('SELECT COUNT(*) FROM seasons').fetchone()[0] == 1
          db.execute('INSERT INTO players(id,public_name,role,initials,avatar_a,avatar_b) VALUES(?,?,?,?,?,?)',
                     ('p1','Portero prueba','Portero','PP','#147aa3','#6540a7'))
          try:
              db.execute('INSERT INTO matches(id,season_id,played_on,opponent,goals_for,goals_against,saves,goalkeeper_id) VALUES(?,?,?,?,?,?,?,?)',
                         ('invalid','season-2026','2026-11-17','Rival',-1,0,0,'p1'))
          except sqlite3.IntegrityError:
              pass
          else:
              raise AssertionError('Expected SQL CHECK to reject negative score')
          PY
      - run: npm run build
      - run: npm run check:no-picomatch
      - run: npm audit --audit-level=high
      - name: Validate documentation and versioned notes
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -f ../documentacion/FLUJO_GIT_Y_RELEASES.md
          test -f ../documentacion/ARQUITECTURA_Y_MANTENIMIENTO.md
          if [[ "$BRANCH" == release/v* ]]; then
            version="${BRANCH#release/}"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test -f "../documentacion/releases/${version}.md"
          fi

  visual:
    name: Visual QA (Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - name: Upload visual report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: martes-fc-visual-${{ github.run_id }}
          path: |
            web/test-results/visual
            web/playwright-report
          if-no-files-found: warn
          retention-days: 14
